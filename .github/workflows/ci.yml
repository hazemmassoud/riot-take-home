name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-${{ hashFiles('mise.toml', 'mix.lock') }}
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      # Non-blocking: bandit 1.12.5 has an open advisory with no fixed release
      # yet; it is mitigated by disabling HTTP/2 (see lib/riot/application.ex).
      - run: mix hex.audit
        continue-on-error: true
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test
      - run: mix dialyzer
